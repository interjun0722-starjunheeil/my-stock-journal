<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3155e8"><title>나의 주식 매매일지 4단계</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17213d}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding:18px 16px 92px}
h1{font-size:23px;margin:8px 0}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{border:0;background:none;font-size:30px}.date,.muted{color:#687792;font-size:14px}
.summary{background:linear-gradient(135deg,#eef6ff,#f8fbff);padding:20px;border-radius:22px;box-shadow:0 6px 20px #dfe6f1}.profit{font-size:29px;font-weight:850;color:#e84462;margin:6px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.stat{background:white;padding:12px;border-radius:14px;font-size:12px;color:#687792}.stat b{display:block;color:#17213d;font-size:16px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.card{border:0;border-radius:19px;padding:17px;text-align:left;min-height:125px;box-shadow:0 4px 16px #e6eaf1}.pink{background:#fff3f5}.blue{background:#f1f7ff}.green{background:#f1fbf5}.purple{background:#f6f2ff}.orange{background:#fff8ed}.emoji{font-size:27px}.card h2{font-size:16px;margin:10px 0 3px}.card p{font-size:12px;color:#71809a;margin:0}
.cta,.save{width:100%;border:0;border-radius:15px;padding:16px;background:#3155e8;color:#fff;font-size:16px;font-weight:800;margin-top:15px}
label{font-size:13px;font-weight:700;color:#4b5a75}input,select,textarea{width:100%;padding:13px;margin:6px 0 13px;border:1px solid #dfe5ee;border-radius:11px;font-size:15px}.row{display:flex;gap:10px}.row>div{flex:1}
.tabs{display:flex;gap:8px;margin:8px 0 18px}.tabs button{flex:1;padding:12px;border:0;border-radius:12px;background:#edf1f7;font-weight:700}.tabs .on{background:#3155e8;color:#fff}
.item{padding:15px;border-radius:16px;background:#f7f9fc;margin:9px 0}.item b{font-size:16px}.gain{color:#e84462;font-weight:800}.loss{color:#3271d8;font-weight:800}.hold{color:#3155e8;font-weight:800}
.chart{height:190px;background:#fff;border:1px solid #e7ebf2;border-radius:18px;padding:12px;margin-top:14px}.bars{height:135px;display:flex;align-items:end;gap:8px;border-bottom:1px solid #dfe4ed;padding:0 5px}.bar{flex:1;background:#3155e8;border-radius:7px 7px 0 0;min-height:4px}.bar.neg{background:#8ba1d9}.barlabel{display:flex;gap:8px;padding:6px 5px;font-size:10px;color:#71809a}.barlabel span{flex:1;text-align:center}.metric{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid #edf0f4}.metric:last-child{border-bottom:0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:68px;background:#fff;border-top:1px solid #edf0f5;display:flex;justify-content:space-around;align-items:center}nav button{background:none;border:0;color:#71809b;font-size:11px}nav span{display:block;font-size:20px}nav .active{color:#3155e8;font-weight:800}
</style></head><body><div id="root"></div>
<script>
const K='stockJournal3';const P='stockPrices3';const get=()=>JSON.parse(localStorage.getItem(K)||'[]');const prices=()=>JSON.parse(localStorage.getItem(P)||'{}');
function names(){let a=get();return [...new Set(a.map(x=>x.s))].filter(s=>holdingQty(s)>0)}
function holdingQty(s){let a=get();return a.filter(x=>x.s===s&&x.type==='buy').reduce((n,x)=>n+x.qty,0)-a.filter(x=>x.s===s&&x.type==='sell').reduce((n,x)=>n+x.qty,0)}
function avgBuy(s){let a=get().filter(x=>x.s===s&&x.type==='buy'),q=a.reduce((n,x)=>n+x.qty,0);return q?a.reduce((n,x)=>n+x.price*x.qty,0)/q:0}
function portfolio(){let pr=prices(),cost=0,value=0;names().forEach(s=>{let q=holdingQty(s),av=avgBuy(s),cp=pr[s]||av;cost+=av*q;value+=cp*q});return {cost,value,profit:value-cost,rate:cost?(value/cost-1)*100:0}}
function nav(){return `<nav><button class="active" onclick="home()"><span>🏠</span>홈</button><button onclick="trade()"><span>📝</span>기록</button><button onclick="historyPage()"><span>📋</span>内역</button><button onclick="holdings()"><span>💼</span>보유</button><button onclick="analysis()"><span>📊</span>분석</button></nav>`}
function shell(t,b){root.innerHTML=`<div class="app"><div class="header"><button class="back" onclick="home()">‹</button><h1>${t}</h1><span></span></div>${b}</div>`}
function home(){let p=portfolio(),a=get(),r=a.filter(x=>x.type==='sell').reduce((n,x)=>n+x.profit,0);root.innerHTML=`<div class="app"><div class="header"><h1>나의 주식 매매일지</h1><span>⚙️</span></div><div class="date">📅 ${new Date().toLocaleDateString('ko-KR')}</div><section class="summary"><div class="muted">현재 평가손익</div><div class="profit">${p.profit>=0?'+':''}${Math.round(p.profit).toLocaleString()}원</div><div class="stats"><div class="stat">평가금액<b>${Math.round(p.value).toLocaleString()}원</b></div><div class="stat">평가수익률<b>${p.rate>=0?'+':''}${p.rate.toFixed(2)}%</b></div><div class="stat">실현손익<b>${r>=0?'+':''}${Math.round(r).toLocaleString()}원</b></div><div class="stat">보유 종목<b>${names().length}개</b></div></div></section><div class="grid"><button class="card pink" onclick="trade()"><div class="emoji">📝</div><h2>매매 기록</h2><p>매수·매도 기록</p></button><button class="card blue" onclick="holdings()"><div class="emoji">💼</div><h2>보유 현황</h2><p>평가손익 확인</p></button><button class="card green" onclick="analysis()"><div class="emoji">📊</div><h2>수익률 분석</h2><p>월별·누적 성적표</p></button><button class="card purple" onclick="stockAnalysis()"><div class="emoji">📈</div><h2>종목별 분석</h2><p>종목별 성적표</p></button></div><button class="cta" onclick="analysis()">📊 투자 성적표 보기</button></div>${nav()}`}
function trade(){shell('매매 기록',`<div class="grid"><button class="card pink" onclick="buyForm()"><div class="emoji">🟢</div><h2>매수 기록</h2><p>매수만 입력</p></button><button class="card blue" onclick="sellForm()"><div class="emoji">🔴</div><h2>매도 기록</h2><p>매도만 입력</p></button></div>`)}
function buyForm(){shell('매수 기록',`<label>종목명</label><input id="s" placeholder="예: 삼성전자"><div class="row"><div><label>매수가</label><input id="p" type="number" placeholder="원"></div><div><label>수량</label><input id="q" type="number" placeholder="주"></div></div><label>매수 이유</label><select id="r"><option>선택하세요</option><option>추세</option><option>뉴스/공시</option><option>실적</option><option>저평가</option><option>기타</option></select><label>메모</label><textarea id="m" rows="3"></textarea><button class="save" onclick="saveBuy()">🟢 저장</button>`)}
function saveBuy(){let s=document.getElementById('s').value.trim(),p=+document.getElementById('p').value,q=+document.getElementById('q').value;if(!s||!p||!q){alert('종목명·매수가·수량을 입력해주세요.');return}let a=get();a.unshift({type:'buy',s,price:p,qty:q,r:document.getElementById('r').value,m:document.getElementById('m').value,d:new Date().toISOString().slice(0,10)});localStorage.setItem(K,JSON.stringify(a));alert('매수 기록 저장 완료');home()}
function sellForm(){let ns=names();shell('매도 기록',`<label>종목명</label><select id="ss">${ns.length?ns.map(s=>`<option>${s}</option>`).join(''):'<option>보유 종목 없음</option>'}</select><div class="row"><div><label>매도가</label><input id="sp" type="number" placeholder="원"></div><div><label>수량</label><input id="sq" type="number" placeholder="주"></div></div><label>매도 이유</label><select id="sr"><option>선택하세요</option><option>목표수익</option><option>손절</option><option>추세전환</option><option>뉴스/공시</option><option>기타</option></select><label>복기</label><textarea id="sm" rows="3"></textarea><button class="save" onclick="saveSell()">🔴 저장</button>`)}
function saveSell(){let s=document.getElementById('ss').value,p=+document.getElementById('sp').value,q=+document.getElementById('sq').value,avail=holdingQty(s);if(!p||!q||q>avail){alert(q>avail?`보유수량 ${avail}주보다 많이 매도할 수 없습니다.`:'매도가와 수량을 입력해주세요.');return}let profit=(p-avgBuy(s))*q,a=get();a.unshift({type:'sell',s,price:p,qty:q,profit,r:document.getElementById('sr').value,m:document.getElementById('sm').value,d:new Date().toISOString().slice(0,10)});localStorage.setItem(K,JSON.stringify(a));alert(`실현손익 ${profit>=0?'+':''}${Math.round(profit).toLocaleString()}원`);home()}
function holdings(){let p=portfolio(),pr=prices(),ns=names();shell('보유 현황',`<section class="summary"><div class="muted">전체 평가금액</div><div class="profit">${Math.round(p.value).toLocaleString()}원</div><div class="${p.profit>=0?'gain':'loss'}">평가손익 ${p.profit>=0?'+':''}${Math.round(p.profit).toLocaleString()}원 · ${p.rate>=0?'+':''}${p.rate.toFixed(2)}%</div></section>${ns.length?ns.map(s=>{let q=holdingQty(s),av=avgBuy(s),cp=pr[s]||av,ep=(cp-av)*q;return `<div class="item"><b>${s}</b><div class="hold">${q}주 · 평균매수 ${Math.round(av).toLocaleString()}원</div><div class="${ep>=0?'gain':'loss'}">평가손익 ${ep>=0?'+':''}${Math.round(ep).toLocaleString()}원</div><label>현재가</label><input id="cp_${encodeURIComponent(s)}" type="number" value="${pr[s]||''}" placeholder="현재가 입력"><button class="save" onclick="savePrice('${s.replace(/'/g,"\\'")}')">현재가 저장</button></div>`}).join(''):'<p class="muted">보유 종목이 없습니다.</p>'}`)}
function savePrice(s){let v=+document.getElementById('cp_'+encodeURIComponent(s)).value;if(!v){alert('현재가를 입력해주세요.');return}let p=prices();p[s]=v;localStorage.setItem(P,JSON.stringify(p));holdings()}
function historyPage(){let a=get();shell('매매 내역',a.length?a.map(x=>x.type==='buy'?`<div class="item"><b>🟢 ${x.s}</b><div class="hold">매수 ${x.qty}주 × ${x.price.toLocaleString()}원</div><div class="muted">${x.d}</div></div>`:`<div class="item"><b>🔴 ${x.s}</b><div class="${x.profit>=0?'gain':'loss'}">매도 ${x.qty}주 × ${x.price.toLocaleString()}원 · ${x.profit>=0?'+':''}${Math.round(x.profit).toLocaleString()}원</div><div class="muted">${x.d}</div></div>`).join(''):'<p class="muted">기록이 없습니다.</p>')}
function analysis(){let s=get().filter(x=>x.type==='sell'),wins=s.filter(x=>x.profit>0).length,profit=s.reduce((n,x)=>n+x.profit,0),avg=s.length?profit/s.length:0;let months={};s.forEach(x=>{let m=(x.d||'').slice(0,7)||'기타';months[m]=(months[m]||0)+x.profit});let vals=Object.values(months),max=Math.max(1,...vals.map(v=>Math.abs(v)));let chart=Object.keys(months).slice(-6).map(m=>{let v=months[m];return `<div class="bar ${v<0?'neg':''}" style="height:${Math.max(4,Math.abs(v)/max*125)}px" title="${Math.round(v).toLocaleString()}원"></div>`}).join('');let labels=Object.keys(months).slice(-6).map(m=>`<span>${m.slice(5)}</span>`).join('');shell('수익률 분석',`<section class="summary"><div class="muted">누적 실현손익</div><div class="profit">${profit>=0?'+':''}${Math.round(profit).toLocaleString()}원</div><div class="stats"><div class="stat">승률<b>${s.length?(wins/s.length*100).toFixed(1):'0.0'}%</b></div><div class="stat">총 매매<b>${s.length}건</b></div><div class="stat">평균 손익<b>${Math.round(avg).toLocaleString()}원</b></div><div class="stat">승리<b>${wins}건</b></div></div></section><div class="chart"><b>월별 실현손익</b><div class="bars">${chart||'<div class="muted">매도 기록을 입력하면 그래프가 생깁니다.</div>'}</div><div class="barlabel">${labels}</div></div><div class="item"><div class="metric"><span>승리 매매</span><b>${wins}건</b></div><div class="metric"><span>손실 매매</span><b>${s.length-wins}건</b></div></div>`)}
function stockAnalysis(){let a=get(),ss=a.filter(x=>x.type==='sell'),map={};ss.forEach(x=>{map[x.s]=(map[x.s]||0)+x.profit});let rows=Object.entries(map).sort((a,b)=>b[1]-a[1]);shell('종목별 분석',rows.length?rows.map(([s,p])=>`<div class="item"><b>${s}</b><div class="${p>=0?'gain':'loss'}">실현손익 ${p>=0?'+':''}${Math.round(p).toLocaleString()}원</div></div>`).join(''):'<p class="muted">매도 기록이 쌓이면 종목별 성적표가 표시됩니다.</p>')}
home();
</script></body></html>
